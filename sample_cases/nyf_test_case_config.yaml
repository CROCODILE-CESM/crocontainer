# Minimal NYF test case — a 10x10 degree flat-bottom regional ocean case
# using NYF (Normal Year Forcing), for capturing the Buildconf
# input_data_list on Derecho.
#
# Run with:
#   conda run -n CrocoDash crocodash create --config nyf_test_case_config.yaml --override

grid:
  resolution: 1.0
  xstart: -60.0
  lenx: 10.0
  ystart: 30.0
  leny: 10.0
  name: nyf_test

topo:
  min_depth: 10.0
  source:
    type: flat
    depth: 1000.0

vgrid:
  type: uniform
  nk: 10

case:
  cesmroot: /glade/u/home/manishrv/work/installs/CROCESM_workshop_2025
  caseroot: /glade/u/home/manishrv/croc_cases/nyf_test_case
  inputdir: /glade/u/home/manishrv/scratch/croc_input/nyf_test_case
  compset: 1850_DATM%NYF_SLND_SICE_MOM6%REGIONAL_SROF_SGLC_SWAV
  atm_grid_name: T62
  machine: derecho
  project: ncgd0011

forcings:
  date_range: ["2020-01-01 00:00:00", "2020-01-09 00:00:00"]
