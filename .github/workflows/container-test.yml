name: CESM runs in container

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 2'  # Tuesday 8am UTC

jobs:
  smoke-test:
    name: Smoke test
    # No GLADE/NYF dependency here -- stays on
    # GH-hosted so it isn't blocked by the self-hosted runner's queue/uptime.
    runs-on: ubuntu-latest
    steps:
      # Local composite actions (uses: ./...) resolve relative to the
      # checked-out repo, so this needs a checkout even though nothing else
      # in this job reads repo files.
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-podman

      - name: Verify container environment
        run: |
          podman run --rm --platform linux/amd64 ghcr.io/crocodile-cesm/crocontainer:latest-amd64 \
            bash -c "
              source /opt/conda/etc/profile.d/conda.sh && \
              conda activate CrocoDash && \
              python -c 'from CrocoDash.case import Case; print(\"CrocoDash OK\")' && \
              test -f /workspace/CESM/cime/scripts/create_newcase && echo 'CESM OK' && \
              test -f /workspace/run_case.sh && echo 'run_case.sh OK' && \
              crocodash fork --help > /dev/null && echo 'crocodash fork OK' && \
              crocodash create --help 2>&1 | grep -q -- '--configure-only' && echo 'crocodash create --configure-only OK'
            "

  discover-domains:
    name: Discover domains
    # The matrix is built from the image rather than hardcoded here, so
    # adding or xfailing a domain in CrocoDash needs no crocontainer-side
    # edit.
    runs-on: ubuntu-latest
    needs: smoke-test
    outputs:
      domains: ${{ steps.discover.outputs.domains }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-podman

      - name: List the domains in CrocoDash's catalog
        id: discover
        run: |
          # tests/fixtures/domains.py arrives with CrocoDash#274. Until the
          # submodule pointer includes it there is nothing to sweep, and an
          # empty matrix says so plainly rather than failing on an import error.
          if [ ! -f CrocoDash/tests/fixtures/domains.py ]; then
            echo "domains=[]" >> "$GITHUB_OUTPUT"
            echo "CrocoDash submodule ($(git -C CrocoDash rev-parse --short HEAD)) predates CrocoDash#274 — skipping the sweep." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          DOMAINS=$(podman run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}/container_scripts/run_domain_sweep.py:/workspace/run_domain_sweep.py" \
            -v "${{ github.workspace }}/CrocoDash:/workspace/crocodash_src" \
            -e CROCODASH_ROOT=/workspace/crocodash_src \
            -e PYTHONPATH=/workspace/crocodash_src:/workspace/crocodash_src/CrocoDash/rm6:/workspace/crocodash_src/CrocoDash/visualCaseGen \
            ghcr.io/crocodile-cesm/crocontainer:latest-amd64 \
            conda run -n CrocoDash --no-capture-output \
              python /workspace/run_domain_sweep.py --list-domains)
          echo "Discovered domains: ${DOMAINS}"
          echo "domains=${DOMAINS}" >> "$GITHUB_OUTPUT"

  domain-sweep:
    name: ${{ matrix.domain }}
    # Deliberately not gated to workflow_dispatch/schedule like the MOM6 jobs
    # below: this never builds or runs MOM6, so it is minutes rather than
    # hours, and a seam or polar regression in CrocoDash's forcing pipeline is
    # exactly the kind of thing worth catching on the PR that causes it.
    # No NYF inputdata either -- nothing here reads atm forcing.
    #
    # One job per domain rather than one job for all sixteen. A single job
    # cannot express this: DOMAIN_TIMEOUT_S is 10 minutes, so a handful of
    # wedged domains overruns any per-job ceiling and takes the healthy
    # domains down with them. The first full run of the sweep lost 12 of 16
    # domains that way. Fanning out gives every domain its own budget, its own
    # log, and its own artifact, and they all run concurrently.
    runs-on: ubuntu-latest
    needs: discover-domains
    if: needs.discover-domains.outputs.domains != '[]'
    # DOMAIN_TIMEOUT_S (10 min) plus the image pull, with room to spare.
    timeout-minutes: 20
    strategy:
      # One bad domain must not cancel the other fifteen -- the whole point of
      # the catalog is to see every topology's result in one run.
      fail-fast: false
      matrix:
        domain: ${{ fromJson(needs.discover-domains.outputs.domains) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-podman

      - name: Create scratch directory on /mnt
        # /mnt is the runner's large temp disk; github.workspace sits on the
        # small root partition.
        run: |
          sudo mkdir -p /mnt/domain_sweep
          sudo chown runner:runner /mnt/domain_sweep

      - name: Sweep ${{ matrix.domain }}
        run: |
          # The whole CrocoDash checkout is injected and put ahead of the
          # image's own copy on PYTHONPATH, rather than mounting individual
          # files over it. Cherry-picking does not work here: the published
          # image is rebuilt weekly from main, so its baked CrocoDash is at
          # some older commit than the submodule, and mounting half of a
          # refactor (extract_forcings/ from CrocoDash#265) over the other
          # half (the image's forcing_configurations/) failed all 16 domains
          # with KeyError: 'get_step_days'. One coherent tree, no guessing
          # about what the image contains. The image still supplies the conda
          # environment, CESM, and inputdata -- only the Python source is
          # overridden. All of this can go once the stack merges and build.yml
          # republishes latest-amd64.
          podman run --rm --platform linux/amd64 \
            -v "/mnt/domain_sweep:/workspace/domain_sweep" \
            -v "${{ github.workspace }}/container_scripts/run_domain_sweep.py:/workspace/run_domain_sweep.py" \
            -v "${{ github.workspace }}/CrocoDash:/workspace/crocodash_src" \
            -e CROCODASH_ROOT=/workspace/crocodash_src \
            -e PYTHONPATH=/workspace/crocodash_src:/workspace/crocodash_src/CrocoDash/rm6:/workspace/crocodash_src/CrocoDash/visualCaseGen \
            ghcr.io/crocodile-cesm/crocontainer:latest-amd64 \
            conda run -n CrocoDash --no-capture-output \
              python /workspace/run_domain_sweep.py \
                --domains "${{ matrix.domain }}" \
                --json-summary "/workspace/domain_sweep/${{ matrix.domain }}.json"

      - name: Upload ${{ matrix.domain }} result
        if: always()
        # podman runs as root, so anything it wrote under /mnt is root-owned
        # and unreadable to the unprivileged user upload-artifact runs as --
        # hence the chown first. Named per domain so the aggregate job below
        # can merge every result into one directory without collisions.
        run: sudo chown -R runner:runner /mnt/domain_sweep || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: domain-result-${{ matrix.domain }}
          path: /mnt/domain_sweep/${{ matrix.domain }}.json
          if-no-files-found: warn

  domain-sweep-summary:
    name: Domain sweep summary
    # Collects the per-domain artifacts into the one table the single-job
    # sweep used to print. Runs even when domains failed -- especially then.
    runs-on: ubuntu-latest
    # discover-domains is needed for its output, not its ordering -- referring
    # to a job's outputs without declaring it here silently yields ''.
    needs: [discover-domains, domain-sweep]
    if: always() && needs.discover-domains.outputs.domains != '[]'
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: domain-result-*
          path: results
          merge-multiple: true

      - name: Publish results table
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          files = sorted(pathlib.Path("results").glob("*.json"))
          if not files:
              print("No domain produced a result.")
              raise SystemExit
          results = [r for f in files for r in json.loads(f.read_text())]
          failed = [r for r in results if r["problems"]]
          print(f"{len(results) - len(failed)}/{len(results)} domains passed\n")
          print("| domain | result | seconds |")
          print("|---|---|---|")
          for r in results:
              status = "ok" if not r["problems"] else "**FAIL**"
              print(f"| {r['key']} | {status} | {r['seconds']:.0f} |")
          for r in failed:
              print(f"\n### {r['key']}\n")
              for problem in r["problems"]:
                  print(f"```\n{problem}\n```")
          EOF

  domain-mom6-build:
    name: MOM6 build
    # Built fresh on every run -- a stale cached executable would hide exactly
    # the build regressions this suite exists to catch -- but built ONCE and
    # shared with the per-domain jobs below, instead of each of them compiling
    # the same thing. Safe because the executable does not depend on the
    # domain: CrocoDash sets MOM6_MEMORY_MODE=dynamic_symmetric, so
    # NIGLOBAL/NJGLOBAL come from MOM_input at runtime. The compset, machine
    # and compiler -- the things the build does depend on -- are identical
    # across every domain in the catalog.
    runs-on: ubuntu-latest
    needs: smoke-test
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-podman

      - name: Emit a config to build against
        # Any domain will do -- the build is domain-independent -- so this uses
        # the first of the matrix below rather than introducing a second list.
        run: |
          podman run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}/container_scripts/run_domain_sweep.py:/workspace/run_domain_sweep.py" \
            -v "${{ github.workspace }}/CrocoDash:/workspace/crocodash_src" \
            -e CROCODASH_ROOT=/workspace/crocodash_src \
            -e PYTHONPATH=/workspace/crocodash_src:/workspace/crocodash_src/CrocoDash/rm6:/workspace/crocodash_src/CrocoDash/visualCaseGen \
            ghcr.io/crocodile-cesm/crocontainer:latest-amd64 \
            conda run -n CrocoDash --no-capture-output \
              python /workspace/run_domain_sweep.py \
                --emit-config equator_prime_meridian > case_config.yaml

      - name: Build MOM6
        run: |
          mkdir -p "${{ github.workspace }}/buildout"
          podman run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}/case_config.yaml:/workspace/case_config.yaml" \
            -v "${{ github.workspace }}/container_scripts/run_case.sh:/workspace/run_case.sh" \
            -v "${{ github.workspace }}/CrocoDash:/workspace/crocodash_src" \
            -v "${{ github.workspace }}/buildout:/workspace/buildout" \
            -e CROCODASH_ROOT=/workspace/crocodash_src \
            -e PYTHONPATH=/workspace/crocodash_src:/workspace/crocodash_src/CrocoDash/rm6:/workspace/crocodash_src/CrocoDash/visualCaseGen \
            -e CROC_BUILD_ONLY=1 \
            -e CROC_BUILD_ARCHIVE=/workspace/buildout/build.tgz \
            ghcr.io/crocodile-cesm/crocontainer:latest-amd64 \
            /bin/bash /workspace/run_case.sh
          sudo chown -R runner:runner "${{ github.workspace }}/buildout"
          ls -lh "${{ github.workspace }}/buildout"

      - uses: actions/upload-artifact@v4
        with:
          # Scoped to this run by name, so nothing can leak a build between
          # runs -- the point is a fresh compile every time, shared only here.
          name: mom6-build-${{ github.run_id }}
          path: buildout/build.tgz
          retention-days: 1

  domain-mom6-run:
    name: MOM6 ${{ matrix.domain }}
    # Actually runs MOM6 on a handful of catalog domains, rather than stopping
    # at "did CrocoDash produce plausible forcing" like domain-sweep does.
    #
    # This replaced a CIME create_test suite that ran the same check on a
    # single hardcoded grid. That path read testlist_mom.xml out of the MOM
    # interface repo and its testmods hardcoded NIGLOBAL/NJGLOBAL and an
    # ocean_hgrid filename, so every domain needed an upstream entry, its own
    # testmods dir, and an image rebuild before CI could see it. run_case.sh
    # takes a CrocoDash YAML directly, which is all this needs: the sweep
    # already proved the forcing is good, so what is left is whether MOM6
    # accepts the grid and runs.
    runs-on: ubuntu-latest
    needs: domain-mom6-build
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Chosen, not discovered -- three topologies that stress MOM6's grid
        # handling in different ways. Keep equator_prime_meridian first: the
        # build job above builds against whichever is listed first.
        domain:
          - equator_prime_meridian   # lat and lon both change sign
          - dateline_seam_360        # crosses the antimeridian
          - arctic_cap               # polar projection, non-rectangular
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-podman

      - uses: actions/download-artifact@v4
        with:
          name: mom6-build-${{ github.run_id }}
          path: buildin

      - name: Emit the CrocoDash config for ${{ matrix.domain }}
        # Same build_config() the sweep uses, so MOM6 runs the identical case
        # definition the sweep validated -- only the caseroot differs.
        run: |
          podman run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}/container_scripts/run_domain_sweep.py:/workspace/run_domain_sweep.py" \
            -v "${{ github.workspace }}/CrocoDash:/workspace/crocodash_src" \
            -e CROCODASH_ROOT=/workspace/crocodash_src \
            -e PYTHONPATH=/workspace/crocodash_src:/workspace/crocodash_src/CrocoDash/rm6:/workspace/crocodash_src/CrocoDash/visualCaseGen \
            ghcr.io/crocodile-cesm/crocontainer:latest-amd64 \
            conda run -n CrocoDash --no-capture-output \
              python /workspace/run_domain_sweep.py \
                --emit-config "${{ matrix.domain }}" > case_config.yaml
          echo "--- case_config.yaml"; cat case_config.yaml

      - name: Run MOM6 on ${{ matrix.domain }}
        # CROC_BUILD_ARCHIVE without CROC_BUILD_ONLY means "restore this build
        # tree instead of compiling", so this job goes straight to case.submit.
        run: |
          mkdir -p "${{ github.workspace }}/runout"
          podman run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}/case_config.yaml:/workspace/case_config.yaml" \
            -v "${{ github.workspace }}/container_scripts/run_case.sh:/workspace/run_case.sh" \
            -v "${{ github.workspace }}/CrocoDash:/workspace/crocodash_src" \
            -v "${{ github.workspace }}/buildin/build.tgz:/workspace/build.tgz" \
            -e CROCODASH_ROOT=/workspace/crocodash_src \
            -e PYTHONPATH=/workspace/crocodash_src:/workspace/crocodash_src/CrocoDash/rm6:/workspace/crocodash_src/CrocoDash/visualCaseGen \
            -v "${{ github.workspace }}/runout:/workspace/runout" \
            -e CROC_BUILD_ARCHIVE=/workspace/build.tgz \
            -e CROC_RUN_ARCHIVE=/workspace/runout/run-${{ matrix.domain }}.tgz \
            ghcr.io/crocodile-cesm/crocontainer:latest-amd64 \
            /bin/bash /workspace/run_case.sh

      - name: Collect ${{ matrix.domain }} run output
        if: always()
        # podman runs as root, so what it wrote under runout/ is root-owned.
        run: sudo chown -R runner:runner "${{ github.workspace }}/runout" || true

      - uses: actions/upload-artifact@v4
        if: always()
        # always(), because a failed run is the one whose ocn.log/cesm.log you
        # actually want to read.
        with:
          name: mom6-run-${{ matrix.domain }}-${{ github.run_id }}
          path: runout/run-${{ matrix.domain }}.tgz
          if-no-files-found: warn

  domain-mom6-debug:
    name: MOM6 debug (${{ matrix.domain }})
    # A debug build -- -fcheck=bounds and FP traps -- on one domain. This is
    # the coverage the old SMS_D create_test jobs provided and the optimised
    # domain-mom6-run jobs do not: an out-of-bounds access or a NaN that an
    # optimised build runs straight past. A regional grid with open boundaries
    # is exactly where those hide, so it is worth one job.
    #
    # Self-contained rather than sharing domain-mom6-build's artifact: a debug
    # build is a different executable, so it cannot reuse the optimised one.
    runs-on: ubuntu-latest
    needs: smoke-test
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # One domain, deliberately the least regular one: a polar projection is
        # the likeliest to surface an indexing bug. Add entries here if the
        # extra build time is ever worth it.
        domain:
          - arctic_cap
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-podman

      - name: Emit the CrocoDash config for ${{ matrix.domain }}
        run: |
          podman run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}/container_scripts/run_domain_sweep.py:/workspace/run_domain_sweep.py" \
            -v "${{ github.workspace }}/CrocoDash:/workspace/crocodash_src" \
            -e CROCODASH_ROOT=/workspace/crocodash_src \
            -e PYTHONPATH=/workspace/crocodash_src:/workspace/crocodash_src/CrocoDash/rm6:/workspace/crocodash_src/CrocoDash/visualCaseGen \
            ghcr.io/crocodile-cesm/crocontainer:latest-amd64 \
            conda run -n CrocoDash --no-capture-output \
              python /workspace/run_domain_sweep.py \
                --emit-config "${{ matrix.domain }}" > case_config.yaml

      - name: Build and run MOM6 with DEBUG=TRUE
        run: |
          mkdir -p "${{ github.workspace }}/runout"
          podman run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}/case_config.yaml:/workspace/case_config.yaml" \
            -v "${{ github.workspace }}/container_scripts/run_case.sh:/workspace/run_case.sh" \
            -v "${{ github.workspace }}/CrocoDash:/workspace/crocodash_src" \
            -v "${{ github.workspace }}/runout:/workspace/runout" \
            -e CROCODASH_ROOT=/workspace/crocodash_src \
            -e PYTHONPATH=/workspace/crocodash_src:/workspace/crocodash_src/CrocoDash/rm6:/workspace/crocodash_src/CrocoDash/visualCaseGen \
            -e CROC_DEBUG_BUILD=1 \
            -e CROC_RUN_ARCHIVE=/workspace/runout/run-debug-${{ matrix.domain }}.tgz \
            ghcr.io/crocodile-cesm/crocontainer:latest-amd64 \
            /bin/bash /workspace/run_case.sh

      - name: Collect debug run output
        if: always()
        run: sudo chown -R runner:runner "${{ github.workspace }}/runout" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mom6-run-debug-${{ matrix.domain }}-${{ github.run_id }}
          path: runout/run-debug-${{ matrix.domain }}.tgz
          if-no-files-found: warn
