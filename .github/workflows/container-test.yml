name: CESM runs in container

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 2'  # Tuesday 8am UTC

jobs:
  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Configure podman storage on /mnt
        run: |
          sudo mkdir -p /mnt/podman-storage
          sudo chown runner:runner /mnt/podman-storage
          mkdir -p $HOME/.config/containers
          printf '[storage]\ndriver = "overlay"\ngraphRoot = "/mnt/podman-storage"\n' \
            > $HOME/.config/containers/storage.conf

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull container image
        run: podman pull --platform linux/amd64 ghcr.io/crocodile-cesm/crocontainer:latest-amd64

      - name: Verify container environment
        run: |
          podman run --rm --platform linux/amd64 ghcr.io/crocodile-cesm/crocontainer:latest-amd64 \
            bash -c "
              source /opt/conda/etc/profile.d/conda.sh && \
              conda activate CrocoDash && \
              python -c 'from CrocoDash.case import Case; print(\"CrocoDash OK\")' && \
              test -f /workspace/CESM/cime/scripts/create_newcase && echo 'CESM OK' && \
              test -f /workspace/run_case.sh && echo 'run_case.sh OK' && \
              test -f /workspace/create_case_from_bundle.py && echo 'create_case_from_bundle.py OK'
            "

  nyf-run-test:
    name: NYF end-to-end
    runs-on: ubuntu-latest
    needs: smoke-test
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure podman storage on /mnt
        run: |
          sudo mkdir -p /mnt/podman-storage
          sudo chown runner:runner /mnt/podman-storage
          mkdir -p $HOME/.config/containers
          printf '[storage]\ndriver = "overlay"\ngraphRoot = "/mnt/podman-storage"\n' \
            > $HOME/.config/containers/storage.conf

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache NYF inputdata
        uses: actions/cache@v4
        id: nyf-cache
        with:
          path: cesm_nyf_inputdata
          key: nyf-inputdata-${{ hashFiles('scripts/nyf_inputdata_list.txt') }}

      - name: Download NYF inputdata
        if: steps.nyf-cache.outputs.cache-hit != 'true'
        run: bash scripts/download_nyf_inputdata.sh ./cesm_nyf_inputdata 8

      - name: Pull container image
        run: podman pull --platform linux/amd64 ghcr.io/crocodile-cesm/crocontainer:latest-amd64

      - name: Create scratch directory
        run: mkdir -p cesm_scratch

      - name: Run NYF case end-to-end
        run: |
          podman run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}/cesm_nyf_inputdata:/root/cesm/inputdata" \
            -v "${{ github.workspace }}/cesm_scratch:/root/cesm/scratch" \
            -v "${{ github.workspace }}/container_scripts/case_setup.py:/workspace/case_setup.py" \
            -v "${{ github.workspace }}/container_scripts/panama_case_config.yaml:/workspace/panama_case_config.yaml" \
            -v "${{ github.workspace }}/container_scripts/run_case.sh:/workspace/run_case.sh" \
            ghcr.io/crocodile-cesm/crocontainer:latest-amd64 \
            /bin/bash /workspace/run_case.sh

      - name: Upload CESM logs and output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cesm-nyf-${{ github.run_id }}
          path: ${{ github.workspace }}/cesm_scratch/case/run
          if-no-files-found: warn
