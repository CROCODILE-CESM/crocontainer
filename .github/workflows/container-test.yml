name: CESM runs in container

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 2'  # Tuesday 8am UTC

jobs:
  smoke-test:
    name: Smoke test
    # No GLADE/NYF dependency here, unlike regional-test -- stays on
    # GH-hosted so it isn't blocked by the self-hosted runner's queue/uptime.
    runs-on: ubuntu-latest
    steps:
      # Local composite actions (uses: ./...) resolve relative to the
      # checked-out repo, so this needs a checkout even though nothing else
      # in this job reads repo files.
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-podman

      - name: Verify container environment
        run: |
          podman run --rm --platform linux/amd64 ghcr.io/crocodile-cesm/crocontainer:latest-amd64 \
            bash -c "
              source /opt/conda/etc/profile.d/conda.sh && \
              conda activate CrocoDash && \
              python -c 'from CrocoDash.case import Case; print(\"CrocoDash OK\")' && \
              test -f /workspace/CESM/cime/scripts/create_newcase && echo 'CESM OK' && \
              test -f /workspace/run_case.sh && echo 'run_case.sh OK' && \
              crocodash fork --help > /dev/null && echo 'crocodash fork OK' && \
              crocodash create --help 2>&1 | grep -q -- '--configure-only' && echo 'crocodash create --configure-only OK'
            "

  discover-regional-tests:
    name: Discover regional tests
    # Just parses testlist_mom.xml/config_compsets.xml out of the image --
    # no GLADE/NYF dependency, same reasoning as smoke-test above.
    runs-on: ubuntu-latest
    needs: smoke-test
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    outputs:
      tests: ${{ steps.discover.outputs.tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-podman

      - name: List regional (MOM6%REGIONAL) tests
        id: discover
        run: |
          # testlist_mom.xml/config_compsets.xml are the MOM interface's own
          # source of truth -- any test defined there against a %REGIONAL
          # compset is picked up automatically, no crocontainer-side
          # annotation needed. See discover_regional_tests.py.
          TESTS=$(podman run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}/container_scripts/discover_regional_tests.py:/workspace/discover_regional_tests.py" \
            ghcr.io/crocodile-cesm/crocontainer:latest-amd64 \
            python /workspace/discover_regional_tests.py)
          echo "Discovered tests: ${TESTS}"
          echo "tests=${TESTS}" >> "$GITHUB_OUTPUT"

  regional-test:
    name: ${{ matrix.test }}
    runs-on: ubuntu-latest
    needs: discover-regional-tests
    if: needs.discover-regional-tests.outputs.tests != '[]'
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.discover-regional-tests.outputs.tests) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-podman

      - name: Create scratch/inputdata directories on /mnt
        # /mnt (not the runner's small root partition, already the reason
        # podman's own storage above is redirected there) -- github.workspace
        # sits on the small root partition, while /mnt is the much larger
        # temp disk podman's own image layers are already redirected to.
        run: |
          sudo mkdir -p /mnt/cesm_scratch /mnt/cesm_nyf_inputdata
          sudo chown runner:runner /mnt/cesm_scratch /mnt/cesm_nyf_inputdata

      - name: Cache NYF inputdata
        uses: actions/cache@v4
        id: nyf-cache
        with:
          path: /mnt/cesm_nyf_inputdata
          key: nyf-inputdata-${{ hashFiles('scripts/nyf_inputdata_list.txt') }}

      - name: Download NYF inputdata
        if: steps.nyf-cache.outputs.cache-hit != 'true'
        run: bash scripts/download_nyf_inputdata.sh /mnt/cesm_nyf_inputdata 8

      - name: Sanitize test name for artifact naming
        id: name
        run: echo "safe=$(echo '${{ matrix.test }}' | tr -c 'A-Za-z0-9_-' '_')" >> "$GITHUB_OUTPUT"

      - name: Regenerate CrocoDash data and run create_test
        run: |
          # Mounts this repo's own copies of the regen/entrypoint scripts and
          # regional_configs/ so CI runs the current PR's versions rather
          # than whatever was baked into the already-published image. Also
          # mounts testmods_overrides/mom/regional/container_smoke straight
          # into the container's baked-in CESM checkout's testmods_dirs --
          # this is the PE-layout fix (NTASKS=1, since ubuntu-latest caps
          # MAX_MPITASKS_PER_NODE well below what the Derecho-sized regional
          # testmods assume) applied at CI runtime, without needing a PR to
          # the external CROCODILE-CESM/CESM fork.
          podman run --rm --platform linux/amd64 \
            -v "/mnt/cesm_nyf_inputdata:/root/cesm/inputdata" \
            -v "/mnt/cesm_scratch:/root/cesm/scratch" \
            -v "${{ github.workspace }}/container_scripts/run_regional_test.py:/workspace/run_regional_test.py" \
            -v "${{ github.workspace }}/container_scripts/regional_configs:/workspace/regional_configs" \
            -v "${{ github.workspace }}/container_scripts/testmods_overrides/mom/regional/container_smoke:/workspace/CESM/components/mom/cime_config/testdefs/testmods_dirs/mom/regional/container_smoke" \
            ghcr.io/crocodile-cesm/crocontainer:latest-amd64 \
            conda run -n CrocoDash python /workspace/run_regional_test.py "${{ matrix.test }}"

      - name: Print run logs on failure
        # RUNDIR resolves to $CIME_OUTPUT_ROOT/$CASE/run -- CIME_OUTPUT_ROOT
        # defaults to the ubuntu-latest machine's plain scratch root, not
        # --test-root, so actual run logs (cesm.log etc) land in a sibling
        # tree next to tests/regional/, not under it. sudo cat straight into
        # the job log instead of uploading as an artifact -- podman runs the
        # container as root, so these are root-owned on the host, and even
        # `sudo chmod -R` beforehand didn't make them readable to the
        # unprivileged runner user actions/upload-artifact runs as.
        if: failure()
        run: |
          sudo find /mnt/cesm_scratch -path '*/run/*' -name '*.log*' -print -exec sudo cat {} \;

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cime-test-${{ steps.name.outputs.safe }}-${{ github.run_id }}
          path: /mnt/cesm_scratch/tests/regional
          if-no-files-found: warn
