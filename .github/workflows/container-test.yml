name: Container Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 2'  # Tuesday 8am UTC

jobs:
  smoke-test:
    name: Smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Linux: podman is pre-installed on ubuntu-latest runners.
      # vfkit (default macOS VM backend) fails on GitHub runners; use QEMU instead.
      - name: Set up Podman (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install podman qemu
          podman machine init --provider=qemu --cpus 2 --memory 6144 --disk-size 60
          podman machine start

      - name: Set up Podman (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          winget install --id RedHat.Podman -e --silent --accept-package-agreements --accept-source-agreements
          $podmanPath = "C:\Program Files\RedHat\Podman"
          echo "$podmanPath" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$podmanPath\podman.exe" machine init --cpus 2 --memory 6144
          & "$podmanPath\podman.exe" machine start

      - name: Pull container image
        shell: bash
        run: podman pull --platform linux/amd64 ghcr.io/crocodile-cesm/crocontainer:latest

      - name: Verify container environment
        shell: bash
        run: |
          podman run --rm --platform linux/amd64 ghcr.io/crocodile-cesm/crocontainer:latest \
            bash -c "
              source /opt/conda/etc/profile.d/conda.sh && \
              conda activate CrocoDash && \
              python -c 'from CrocoDash.case import Case; print(\"CrocoDash OK\")' && \
              test -f /workspace/CESM/cime/scripts/create_newcase && echo 'CESM OK' && \
              test -f /workspace/run_case.sh && echo 'run_case.sh OK' && \
              test -f /workspace/create_case_from_bundle.py && echo 'create_case_from_bundle.py OK'
            "

  nyf-run-test:
    name: NYF end-to-end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    timeout-minutes: 120
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Linux: podman is pre-installed on ubuntu-latest runners.
      # vfkit (default macOS VM backend) fails on GitHub runners; use QEMU instead.
      - name: Set up Podman (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install podman qemu
          podman machine init --provider=qemu --cpus 2 --memory 6144 --disk-size 60
          podman machine start

      - name: Set up Podman (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          winget install --id RedHat.Podman -e --silent --accept-package-agreements --accept-source-agreements
          $podmanPath = "C:\Program Files\RedHat\Podman"
          echo "$podmanPath" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$podmanPath\podman.exe" machine init --cpus 2 --memory 6144
          & "$podmanPath\podman.exe" machine start

      # Git Bash on Windows gives /c/... paths; Podman on Windows needs Windows-native paths for volume mounts.
      - name: Set workspace path
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "CONTAINER_WS=$(cygpath -w "$GITHUB_WORKSPACE")" >> $GITHUB_ENV
          else
            echo "CONTAINER_WS=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          fi

      - name: Cache NYF inputdata
        uses: actions/cache@v4
        id: nyf-cache
        with:
          path: cesm_nyf_inputdata
          key: nyf-inputdata-${{ hashFiles('scripts/nyf_inputdata_list.txt') }}

      - name: Download NYF inputdata
        if: steps.nyf-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/download_nyf_inputdata.sh ./cesm_nyf_inputdata 8

      - name: Pull container image
        shell: bash
        run: podman pull --platform linux/amd64 ghcr.io/crocodile-cesm/crocontainer:latest

      - name: Create scratch directory
        shell: bash
        run: mkdir -p cesm_scratch

      - name: Run NYF case end-to-end
        shell: bash
        run: |
          podman run --rm --platform linux/amd64 \
            -v "$CONTAINER_WS/cesm_nyf_inputdata:/root/cesm/inputdata" \
            -v "$CONTAINER_WS/cesm_scratch:/root/cesm/scratch" \
            -v "$CONTAINER_WS/container_scripts/case_setup.py:/workspace/case_setup.py" \
            -v "$CONTAINER_WS/container_scripts/run_case.sh:/workspace/run_case.sh" \
            ghcr.io/crocodile-cesm/crocontainer:latest \
            /bin/bash /workspace/run_case.sh
