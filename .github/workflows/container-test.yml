name: Container Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 2'  # Tuesday 8am UTC

jobs:
  smoke-test:
    name: Smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Set up Docker (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install colima docker
          colima start --cpu 2 --memory 6 --disk 60 --wait

      - name: Pull container image
        shell: bash
        run: docker pull ghcr.io/crocodile-cesm/crocontainer:latest

      - name: Verify container environment
        shell: bash
        run: |
          docker run --rm ghcr.io/crocodile-cesm/crocontainer:latest \
            bash -c "
              source /opt/conda/etc/profile.d/conda.sh && \
              conda activate CrocoDash && \
              python -c 'from CrocoDash.case import Case; print(\"CrocoDash OK\")' && \
              test -f /workspace/CESM/cime/scripts/create_newcase && echo 'CESM OK' && \
              test -f /workspace/run_case.sh && echo 'run_case.sh OK' && \
              test -f /workspace/create_case_from_bundle.py && echo 'create_case_from_bundle.py OK'
            "

  nyf-run-test:
    name: NYF end-to-end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    timeout-minutes: 120
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install colima docker
          colima start --cpu 2 --memory 6 --disk 60 --wait

      # Git Bash on Windows gives backslash paths; Docker volume mounts need forward slashes.
      - name: Resolve workspace path for Docker mounts
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "DOCKER_WS=$(cygpath -u "$GITHUB_WORKSPACE")" >> $GITHUB_ENV
          else
            echo "DOCKER_WS=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          fi

      - name: Cache NYF inputdata
        uses: actions/cache@v4
        id: nyf-cache
        with:
          path: cesm_nyf_inputdata
          key: nyf-inputdata-${{ hashFiles('scripts/nyf_inputdata_list.txt') }}

      - name: Download NYF inputdata
        if: steps.nyf-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/download_nyf_inputdata.sh ./cesm_nyf_inputdata 8

      - name: Pull container image
        shell: bash
        run: docker pull ghcr.io/crocodile-cesm/crocontainer:latest

      - name: Create scratch directory
        shell: bash
        run: mkdir -p cesm_scratch

      - name: Run NYF case end-to-end
        shell: bash
        run: |
          docker run --rm \
            -v "$DOCKER_WS/cesm_nyf_inputdata:/root/cesm/inputdata" \
            -v "$DOCKER_WS/cesm_scratch:/root/cesm/scratch" \
            -v "$DOCKER_WS/container_scripts/case_setup.py:/workspace/case_setup.py" \
            -v "$DOCKER_WS/container_scripts/run_case.sh:/workspace/run_case.sh" \
            ghcr.io/crocodile-cesm/crocontainer:latest \
            /bin/bash /workspace/run_case.sh
