name: Container Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 2'  # Tuesday 8am UTC

jobs:
  smoke-test:
    name: Smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        # macOS and Windows are excluded: GitHub macOS runners don't support nested
        # virtualization (HVF/QEMU both fail), so no VM-based approach can run Linux
        # containers there. Windows users run via WSL2 = Ubuntu, already covered here.
        # macOS users follow the Homebrew Podman docs, which work on real Macs.
    steps:
      # podman is pre-installed on ubuntu-latest.
      - name: Set container CLI
        shell: bash
        run: echo "CONTAINER_CLI=podman" >> $GITHUB_ENV

      - name: Pull container image
        shell: bash
        run: $CONTAINER_CLI pull --platform linux/amd64 ghcr.io/crocodile-cesm/crocontainer:latest-amd64

      - name: Verify container environment
        shell: bash
        run: |
          $CONTAINER_CLI run --rm --platform linux/amd64 ghcr.io/crocodile-cesm/crocontainer:latest-amd64 \
            bash -c "
              source /opt/conda/etc/profile.d/conda.sh && \
              conda activate CrocoDash && \
              python -c 'from CrocoDash.case import Case; print(\"CrocoDash OK\")' && \
              test -f /workspace/CESM/cime/scripts/create_newcase && echo 'CESM OK' && \
              test -f /workspace/run_case.sh && echo 'run_case.sh OK' && \
              test -f /workspace/create_case_from_bundle.py && echo 'create_case_from_bundle.py OK'
            "

  nyf-run-test:
    name: NYF end-to-end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    timeout-minutes: 120
    strategy:
      matrix:
        os: [ubuntu-latest]
        # macOS/Windows excluded for the same reasons as smoke-test above.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set container CLI and workspace path
        shell: bash
        run: |
          echo "CONTAINER_CLI=podman" >> $GITHUB_ENV
          echo "CONTAINER_WS=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Cache NYF inputdata
        uses: actions/cache@v4
        id: nyf-cache
        with:
          path: cesm_nyf_inputdata
          key: nyf-inputdata-${{ hashFiles('scripts/nyf_inputdata_list.txt') }}

      - name: Download NYF inputdata
        if: steps.nyf-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/download_nyf_inputdata.sh ./cesm_nyf_inputdata 8

      - name: Pull container image
        shell: bash
        run: $CONTAINER_CLI pull --platform linux/amd64 ghcr.io/crocodile-cesm/crocontainer:latest-amd64

      - name: Create scratch directory
        shell: bash
        run: mkdir -p cesm_scratch

      - name: Run NYF case end-to-end
        shell: bash
        run: |
          $CONTAINER_CLI run --rm --platform linux/amd64 \
            -v "$CONTAINER_WS/cesm_nyf_inputdata:/root/cesm/inputdata" \
            -v "$CONTAINER_WS/cesm_scratch:/root/cesm/scratch" \
            -v "$CONTAINER_WS/container_scripts/case_setup.py:/workspace/case_setup.py" \
            -v "$CONTAINER_WS/container_scripts/run_case.sh:/workspace/run_case.sh" \
            ghcr.io/crocodile-cesm/crocontainer:latest-amd64 \
            /bin/bash /workspace/run_case.sh
