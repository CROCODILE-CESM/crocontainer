name: CESM runs in container

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 2'  # Tuesday 8am UTC

jobs:
  smoke-test:
    name: Smoke test
    # No GLADE/NYF dependency here, unlike regional-test -- stays on
    # GH-hosted so it isn't blocked by the self-hosted runner's queue/uptime.
    runs-on: ubuntu-latest
    steps:
      # Local composite actions (uses: ./...) resolve relative to the
      # checked-out repo, so this needs a checkout even though nothing else
      # in this job reads repo files.
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-podman

      - name: Verify container environment
        run: |
          podman run --rm --platform linux/amd64 ghcr.io/crocodile-cesm/crocontainer:latest-amd64 \
            bash -c "
              source /opt/conda/etc/profile.d/conda.sh && \
              conda activate CrocoDash && \
              python -c 'from CrocoDash.case import Case; print(\"CrocoDash OK\")' && \
              test -f /workspace/CESM/cime/scripts/create_newcase && echo 'CESM OK' && \
              test -f /workspace/run_case.sh && echo 'run_case.sh OK' && \
              crocodash fork --help > /dev/null && echo 'crocodash fork OK' && \
              crocodash create --help 2>&1 | grep -q -- '--configure-only' && echo 'crocodash create --configure-only OK'
            "

  discover-domains:
    name: Discover domains
    # Mirrors discover-regional-tests below: the matrix is built from the
    # image rather than hardcoded here, so adding or xfailing a domain in
    # CrocoDash needs no crocontainer-side edit.
    runs-on: ubuntu-latest
    needs: smoke-test
    outputs:
      domains: ${{ steps.discover.outputs.domains }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-podman

      - name: List the domains in CrocoDash's catalog
        id: discover
        run: |
          # tests/fixtures/domains.py arrives with CrocoDash#274. Until the
          # submodule pointer includes it there is nothing to sweep, and an
          # empty matrix says so plainly rather than failing on an import error.
          if [ ! -f CrocoDash/tests/fixtures/domains.py ]; then
            echo "domains=[]" >> "$GITHUB_OUTPUT"
            echo "CrocoDash submodule ($(git -C CrocoDash rev-parse --short HEAD)) predates CrocoDash#274 — skipping the sweep." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          DOMAINS=$(podman run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}/container_scripts/run_domain_sweep.py:/workspace/run_domain_sweep.py" \
            -v "${{ github.workspace }}/CrocoDash:/workspace/crocodash_src" \
            -e CROCODASH_ROOT=/workspace/crocodash_src \
            -e PYTHONPATH=/workspace/crocodash_src:/workspace/crocodash_src/CrocoDash/rm6 \
            ghcr.io/crocodile-cesm/crocontainer:latest-amd64 \
            conda run -n CrocoDash --no-capture-output \
              python /workspace/run_domain_sweep.py --list-domains)
          echo "Discovered domains: ${DOMAINS}"
          echo "domains=${DOMAINS}" >> "$GITHUB_OUTPUT"

  domain-sweep:
    name: ${{ matrix.domain }}
    # Deliberately not gated to workflow_dispatch/schedule like regional-test
    # below: this never builds or runs MOM6, so it is minutes rather than
    # hours, and a seam or polar regression in CrocoDash's forcing pipeline is
    # exactly the kind of thing worth catching on the PR that causes it.
    # No NYF inputdata either -- nothing here reads atm forcing.
    #
    # One job per domain rather than one job for all sixteen. A single job
    # cannot express this: DOMAIN_TIMEOUT_S is 10 minutes, so a handful of
    # wedged domains overruns any per-job ceiling and takes the healthy
    # domains down with them. The first full run of the sweep lost 12 of 16
    # domains that way. Fanning out gives every domain its own budget, its own
    # log, and its own artifact, and they all run concurrently.
    runs-on: ubuntu-latest
    needs: discover-domains
    if: needs.discover-domains.outputs.domains != '[]'
    # DOMAIN_TIMEOUT_S (10 min) plus the image pull, with room to spare.
    timeout-minutes: 20
    strategy:
      # One bad domain must not cancel the other fifteen -- the whole point of
      # the catalog is to see every topology's result in one run.
      fail-fast: false
      matrix:
        domain: ${{ fromJson(needs.discover-domains.outputs.domains) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-podman

      - name: Create scratch directory on /mnt
        # Same reasoning as regional-test: /mnt is the runner's large temp
        # disk, github.workspace sits on the small root partition.
        run: |
          sudo mkdir -p /mnt/domain_sweep
          sudo chown runner:runner /mnt/domain_sweep

      - name: Sweep ${{ matrix.domain }}
        run: |
          # The whole CrocoDash checkout is injected and put ahead of the
          # image's own copy on PYTHONPATH, rather than mounting individual
          # files over it. Cherry-picking does not work here: the published
          # image is rebuilt weekly from main, so its baked CrocoDash is at
          # some older commit than the submodule, and mounting half of a
          # refactor (extract_forcings/ from CrocoDash#265) over the other
          # half (the image's forcing_configurations/) failed all 16 domains
          # with KeyError: 'get_step_days'. One coherent tree, no guessing
          # about what the image contains. The image still supplies the conda
          # environment, CESM, and inputdata -- only the Python source is
          # overridden. All of this can go once the stack merges and build.yml
          # republishes latest-amd64.
          podman run --rm --platform linux/amd64 \
            -v "/mnt/domain_sweep:/workspace/domain_sweep" \
            -v "${{ github.workspace }}/container_scripts/run_domain_sweep.py:/workspace/run_domain_sweep.py" \
            -v "${{ github.workspace }}/CrocoDash:/workspace/crocodash_src" \
            -e CROCODASH_ROOT=/workspace/crocodash_src \
            -e PYTHONPATH=/workspace/crocodash_src:/workspace/crocodash_src/CrocoDash/rm6 \
            ghcr.io/crocodile-cesm/crocontainer:latest-amd64 \
            conda run -n CrocoDash --no-capture-output \
              python /workspace/run_domain_sweep.py \
                --domains "${{ matrix.domain }}" \
                --json-summary "/workspace/domain_sweep/${{ matrix.domain }}.json"

      - name: Upload ${{ matrix.domain }} result
        if: always()
        # podman runs as root, so anything it wrote under /mnt is root-owned
        # and unreadable to the unprivileged user upload-artifact runs as --
        # hence the chown first. Named per domain so the aggregate job below
        # can merge every result into one directory without collisions.
        run: sudo chown -R runner:runner /mnt/domain_sweep || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: domain-result-${{ matrix.domain }}
          path: /mnt/domain_sweep/${{ matrix.domain }}.json
          if-no-files-found: warn

  domain-sweep-summary:
    name: Domain sweep summary
    # Collects the per-domain artifacts into the one table the single-job
    # sweep used to print. Runs even when domains failed -- especially then.
    runs-on: ubuntu-latest
    # discover-domains is needed for its output, not its ordering -- referring
    # to a job's outputs without declaring it here silently yields ''.
    needs: [discover-domains, domain-sweep]
    if: always() && needs.discover-domains.outputs.domains != '[]'
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: domain-result-*
          path: results
          merge-multiple: true

      - name: Publish results table
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          files = sorted(pathlib.Path("results").glob("*.json"))
          if not files:
              print("No domain produced a result.")
              raise SystemExit
          results = [r for f in files for r in json.loads(f.read_text())]
          failed = [r for r in results if r["problems"]]
          print(f"{len(results) - len(failed)}/{len(results)} domains passed\n")
          print("| domain | result | seconds |")
          print("|---|---|---|")
          for r in results:
              status = "ok" if not r["problems"] else "**FAIL**"
              print(f"| {r['key']} | {status} | {r['seconds']:.0f} |")
          for r in failed:
              print(f"\n### {r['key']}\n")
              for problem in r["problems"]:
                  print(f"```\n{problem}\n```")
          EOF

  domain-mom6-run:
    name: MOM6 ${{ matrix.domain }}
    # Actually runs MOM6 on a handful of catalog domains, rather than stopping
    # at "did CrocoDash produce plausible forcing" like domain-sweep does.
    #
    # Deliberately NOT routed through create_test/discover-regional-tests. That
    # path reads testlist_mom.xml and config_compsets.xml out of the MOM
    # interface repo, and its regional testmods hardcode NIGLOBAL/NJGLOBAL and
    # an ocean_hgrid filename -- so every domain added there needs an upstream
    # entry, its own testmods dir, and an image rebuild before CI can see it.
    # run_case.sh takes a CrocoDash YAML directly and does create -> build ->
    # submit, which is all this needs: the sweep already proved the forcing is
    # good, so what is left is whether MOM6 accepts the grid and runs.
    #
    # Gated like regional-test below: a MOM6 build is hours, not minutes.
    runs-on: ubuntu-latest
    needs: smoke-test
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # Chosen, not discovered -- three topologies that stress MOM6's grid
        # handling in different ways, kept small because each one is a full
        # build and run. Edit this list to change what MOM6 actually exercises.
        domain:
          - equator_prime_meridian   # lat and lon both change sign
          - dateline_seam_360        # crosses the antimeridian
          - arctic_cap               # polar projection, non-rectangular
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-podman

      - name: Emit the CrocoDash config for ${{ matrix.domain }}
        # Same build_config() the sweep uses, so MOM6 runs the identical case
        # definition the sweep validated -- only the caseroot differs.
        run: |
          podman run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}/container_scripts/run_domain_sweep.py:/workspace/run_domain_sweep.py" \
            -v "${{ github.workspace }}/CrocoDash:/workspace/crocodash_src" \
            -e CROCODASH_ROOT=/workspace/crocodash_src \
            -e PYTHONPATH=/workspace/crocodash_src:/workspace/crocodash_src/CrocoDash/rm6 \
            ghcr.io/crocodile-cesm/crocontainer:latest-amd64 \
            conda run -n CrocoDash --no-capture-output \
              python /workspace/run_domain_sweep.py \
                --emit-config "${{ matrix.domain }}" > case_config.yaml
          echo "--- case_config.yaml"; cat case_config.yaml

      - name: Build and run MOM6 on ${{ matrix.domain }}
        run: |
          podman run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}/case_config.yaml:/workspace/case_config.yaml" \
            -v "${{ github.workspace }}/container_scripts/run_case.sh:/workspace/run_case.sh" \
            -v "${{ github.workspace }}/CrocoDash:/workspace/crocodash_src" \
            -e CROCODASH_ROOT=/workspace/crocodash_src \
            -e PYTHONPATH=/workspace/crocodash_src:/workspace/crocodash_src/CrocoDash/rm6 \
            ghcr.io/crocodile-cesm/crocontainer:latest-amd64 \
            /bin/bash /workspace/run_case.sh

  discover-regional-tests:
    name: Discover regional tests
    # Just parses testlist_mom.xml/config_compsets.xml out of the image --
    # no GLADE/NYF dependency, same reasoning as smoke-test above.
    runs-on: ubuntu-latest
    needs: smoke-test
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    outputs:
      tests: ${{ steps.discover.outputs.tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-podman

      - name: List regional (MOM6%REGIONAL) tests
        id: discover
        run: |
          # testlist_mom.xml/config_compsets.xml are the MOM interface's own
          # source of truth -- any test defined there against a %REGIONAL
          # compset is picked up automatically, no crocontainer-side
          # annotation needed. See discover_regional_tests.py.
          TESTS=$(podman run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}/container_scripts/discover_regional_tests.py:/workspace/discover_regional_tests.py" \
            ghcr.io/crocodile-cesm/crocontainer:latest-amd64 \
            python /workspace/discover_regional_tests.py)
          echo "Discovered tests: ${TESTS}"
          echo "tests=${TESTS}" >> "$GITHUB_OUTPUT"

  regional-test:
    name: ${{ matrix.test }}
    runs-on: ubuntu-latest
    needs: discover-regional-tests
    if: needs.discover-regional-tests.outputs.tests != '[]'
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.discover-regional-tests.outputs.tests) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-podman

      - name: Create scratch/inputdata directories on /mnt
        # /mnt (not the runner's small root partition, already the reason
        # podman's own storage above is redirected there) -- github.workspace
        # sits on the small root partition, while /mnt is the much larger
        # temp disk podman's own image layers are already redirected to.
        run: |
          sudo mkdir -p /mnt/cesm_scratch /mnt/cesm_nyf_inputdata
          sudo chown runner:runner /mnt/cesm_scratch /mnt/cesm_nyf_inputdata

      - name: Cache NYF inputdata
        uses: actions/cache@v4
        id: nyf-cache
        with:
          path: /mnt/cesm_nyf_inputdata
          key: nyf-inputdata-${{ hashFiles('scripts/nyf_inputdata_list.txt') }}

      - name: Download NYF inputdata
        if: steps.nyf-cache.outputs.cache-hit != 'true'
        run: bash scripts/download_nyf_inputdata.sh /mnt/cesm_nyf_inputdata 8

      - name: Sanitize test name for artifact naming
        id: name
        run: echo "safe=$(echo '${{ matrix.test }}' | tr -c 'A-Za-z0-9_-' '_')" >> "$GITHUB_OUTPUT"

      - name: Regenerate CrocoDash data and run create_test
        run: |
          # Mounts this repo's own copies of the regen/entrypoint scripts and
          # regional_configs/ so CI runs the current PR's versions rather
          # than whatever was baked into the already-published image. Also
          # mounts testmods_overrides/mom/regional/container_smoke straight
          # into the container's baked-in CESM checkout's testmods_dirs --
          # this is the PE-layout fix (NTASKS=1, since ubuntu-latest caps
          # MAX_MPITASKS_PER_NODE well below what the Derecho-sized regional
          # testmods assume) applied at CI runtime, without needing a PR to
          # the external CROCODILE-CESM/CESM fork.
          #
          # case.py and reference.py are mounted for the same reason --
          # CrocoDash is installed editable (pip install -e), so overlaying
          # these two files picks up CROCODILE-CESM/CrocoDash#272's fix
          # (custom multi-modifier compsets, e.g. MOM6%REGIONAL%MARBL-BIO)
          # and #273's fix (REFERENCE_OCEAN MARBL tracer support) before
          # those PRs merge and a new image gets built with them baked in.
          # Safe to remove once #272 and #273 merge and build.yml republishes
          # latest-amd64.
          podman run --rm --platform linux/amd64 \
            -v "/mnt/cesm_nyf_inputdata:/root/cesm/inputdata" \
            -v "/mnt/cesm_scratch:/root/cesm/scratch" \
            -v "${{ github.workspace }}/container_scripts/run_regional_test.py:/workspace/run_regional_test.py" \
            -v "${{ github.workspace }}/container_scripts/regional_configs:/workspace/regional_configs" \
            -v "${{ github.workspace }}/container_scripts/testmods_overrides/mom/regional/container_smoke:/workspace/CESM/components/mom/cime_config/testdefs/testmods_dirs/mom/regional/container_smoke" \
            -v "${{ github.workspace }}/CrocoDash/CrocoDash/case.py:/workspace/CrocoDash/CrocoDash/case.py" \
            -v "${{ github.workspace }}/CrocoDash/CrocoDash/raw_data_access/datasets/reference.py:/workspace/CrocoDash/CrocoDash/raw_data_access/datasets/reference.py" \
            ghcr.io/crocodile-cesm/crocontainer:latest-amd64 \
            conda run -n CrocoDash python /workspace/run_regional_test.py "${{ matrix.test }}"

      - name: Print run logs on failure
        # RUNDIR resolves to $CIME_OUTPUT_ROOT/$CASE/run -- CIME_OUTPUT_ROOT
        # defaults to the ubuntu-latest machine's plain scratch root, not
        # --test-root, so actual run logs (cesm.log etc) land in a sibling
        # tree next to tests/regional/, not under it. sudo cat straight into
        # the job log instead of uploading as an artifact -- podman runs the
        # container as root, so these are root-owned on the host, and even
        # `sudo chmod -R` beforehand didn't make them readable to the
        # unprivileged runner user actions/upload-artifact runs as.
        if: failure()
        run: |
          sudo find /mnt/cesm_scratch -path '*/run/*' -name '*.log*' -print -exec sudo cat {} \;

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cime-test-${{ steps.name.outputs.safe }}-${{ github.run_id }}
          path: /mnt/cesm_scratch/tests/regional
          if-no-files-found: warn
