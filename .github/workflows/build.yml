name: Build and Push Container
on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday 6am UTC
  push:
    tags: [ 'v*.*.*' ]
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: crocodile-cesm/crocontainer
  CESM_BRANCH: workshop_2025

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-latest  # QEMU for now; swap to arm runner later if too slow
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
                type=semver,pattern={{version}}
                type=sha,prefix=sha-
                type=raw,value=latest,enable={{is_default_branch}}

      - name: Derive arch suffix
        id: arch
        run: echo "suffix=$(echo ${{ matrix.platform }} | cut -d/ -f2)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
                ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-${{ steps.arch.outputs.suffix }}
                ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-${{ steps.arch.outputs.suffix }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

  # Merge into a single multi-arch manifest
  manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          BASE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          docker buildx imagetools create \
            --tag ${BASE}:latest \
            --tag ${BASE}:sha-${SHA} \
            ${BASE}:latest-amd64 \
            ${BASE}:latest-arm64