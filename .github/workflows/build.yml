name: Build and Push Container
on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday 6am UTC
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: crocodile-cesm/crocontainer
  # Must stay in step with what visualCaseGen asserts in
  # _check_cime_compatibility(): full_regional_cesm carries cime6.4.1, which is
  # what current CrocoDash requires. The alpha09d branch was only ever a
  # cache-busting rename (see 4cfce86) and has been left behind at cime6.2.2.
  CESM_BRANCH: full_regional_cesm

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-latest  # QEMU for now; swap to arm runner later if too slow
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
                type=semver,pattern={{version}}
                type=sha,prefix=sha-
                type=raw,value=latest,enable={{is_default_branch}}

      - name: Derive arch suffix
        id: arch
        run: echo "suffix=$(echo ${{ matrix.platform }} | cut -d/ -f2)" >> $GITHUB_OUTPUT

      # Docker keys the CESM clone layer on the build-args that feed it, so a
      # branch name alone pins that layer forever: every weekly rebuild happily
      # reused a clone taken the first time this arg value was seen, and new
      # commits on the branch never made it into the image. That is why
      # 4cfce86 had to invent a new branch name just to force a cache miss.
      # Resolving the tip here instead means the layer busts exactly when the
      # branch actually moves, and never otherwise.
      - name: Resolve CESM branch tip
        id: cesm
        run: |
          SHA=$(git ls-remote https://github.com/CROCODILE-CESM/CESM \
                  refs/heads/${{ env.CESM_BRANCH }} | cut -f1)
          test -n "$SHA" || { echo "::error::CESM branch ${{ env.CESM_BRANCH }} not found"; exit 1; }
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "CESM ${{ env.CESM_BRANCH }} is at $SHA"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
                CESM_BRANCH=${{ env.CESM_BRANCH }}
                CESM_SHA=${{ steps.cesm.outputs.sha }}
          tags: |
                ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-${{ steps.arch.outputs.suffix }}
                ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-${{ steps.arch.outputs.suffix }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

  # Merge into a single multi-arch manifest
  manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          BASE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          docker buildx imagetools create \
            --tag ${BASE}:latest \
            --tag ${BASE}:sha-${SHA} \
            ${BASE}:latest-amd64 \
            ${BASE}:latest-arm64