name: Build and Push Container
on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday 6am UTC
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: crocodile-cesm/crocontainer
  CESM_BRANCH: full_regional_cesm_alpha09d

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-latest  # QEMU for now; swap to arm runner later if too slow
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
                type=semver,pattern={{version}}
                type=sha,prefix=sha-
                type=raw,value=latest,enable={{is_default_branch}}

      - name: Derive tags
        id: tags
        # latest-<arch> is what every consumer pulls -- CI here, crocontainer
        # users, and the promotion step of any workflow that gates an image
        # before publishing it. Only the default branch and release tags may
        # move it. Previously it was pushed unconditionally, so dispatching
        # this workflow from any feature branch republished the world.
        # sha-<commit>-<arch> is always pushed, so a branch build is still
        # fetchable by commit.
        run: |
          BASE="${REGISTRY}/${IMAGE_NAME}"
          SUFFIX=$(echo "${{ matrix.platform }}" | cut -d/ -f2)
          echo "suffix=${SUFFIX}" >> "$GITHUB_OUTPUT"
          {
            echo "list<<TAGS_EOF"
            echo "${BASE}:sha-${{ github.sha }}-${SUFFIX}"
            if [[ "${{ github.ref }}" == "refs/heads/main" \
               || "${{ github.ref }}" == refs/tags/v* ]]; then
              echo "${BASE}:latest-${SUFFIX}"
            else
              echo "Not the default branch or a release tag: skipping latest-${SUFFIX}." >&2
            fi
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
                CESM_BRANCH=${{ env.CESM_BRANCH }}
          tags: ${{ steps.tags.outputs.list }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

  # Merge into a single multi-arch manifest
  manifest:
    needs: build-and-push
    # Gated for the same reason as the latest-<arch> tags above: this job reads
    # latest-amd64/latest-arm64 and republishes `latest` from them. On a branch
    # build those inputs were never pushed, so it would combine two stale images
    # and re-tag them as current.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          BASE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          docker buildx imagetools create \
            --tag ${BASE}:latest \
            --tag ${BASE}:sha-${SHA} \
            ${BASE}:latest-amd64 \
            ${BASE}:latest-arm64