name: Set up podman and pull crocontainer image
description: >
  Redirects podman's storage to /mnt (the runner's larger temp disk, not the
  small root partition github.workspace sits on), logs in to GHCR, and pulls
  the published crocontainer image. Identical across every job in
  container-test.yml, so it's factored out here rather than repeated -- a
  storage/registry change only needs editing in one place.

runs:
  using: composite
  steps:
    - name: Configure podman storage on /mnt
      shell: bash
      run: |
        sudo mkdir -p /mnt/podman-storage
        sudo chown runner:runner /mnt/podman-storage
        mkdir -p $HOME/.config/containers
        printf '[storage]\ndriver = "overlay"\ngraphRoot = "/mnt/podman-storage"\n' \
          > $HOME/.config/containers/storage.conf

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Pull container image
      shell: bash
      run: podman pull --platform linux/amd64 ghcr.io/crocodile-cesm/crocontainer:latest-amd64
