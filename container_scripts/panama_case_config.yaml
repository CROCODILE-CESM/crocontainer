# Panama domain (3x3 degrees at 0.05 degrees) — matches the pre-staged
# GEBCO bathymetry and GLORYS OBC/IC data used by the container CI so it
# can run end-to-end without live Copernicus Marine credentials.
#
# A CrocoDash case config: case: holds the arguments of CrocoDash's Case(),
# with the grid files panama_grids.py writes, and forcings: the arguments of
# configure_forcings(). Edit a copy of this file to change the compset, dates
# or forcings, and a copy of panama_grids.py to change the domain, resolution
# or vertical grid.

case:
  cesmroot: /workspace/CESM
  caseroot: /workspace/case
  inputdir: /workspace/inputdir
  compset: 1850_DATM%NYF_SLND_SICE_MOM6%REGIONAL_SROF_SGLC_SWAV
  ocn_grid: /workspace/grids/ocean_hgrid.nc
  ocn_topo: /workspace/grids/ocean_topog.nc
  ocn_vgrid: /workspace/grids/ocean_vgrid.nc
  atm_grid_name: T62
  machine: ubuntu-latest
  project: PROJ123

forcings:
  date_range: ["2020-01-01 00:00:00", "2020-01-05 00:00:00"]
  function_name: get_glorys_data_script_for_cli
