# CrocoDash regeneration config for the "mom-regional-bgc" testmods.
# Same philosophy as mom-regional-base.yaml (read that one first) -- a fast,
# fully synthetic/no-network smoke test, not a BGC science validation. Uses
# the same shrunk 0.1deg/10x10/nk=10 Panama domain and DATM%NYF/SROF compset
# swap via compset_override, for the same reasons (see that file's header).
#
# testlist_mom.xml registers this test under CR1850MARBL_JRA_GLOFAS, which
# resolves (external MOM_interface repo, config_compsets.xml) to
# 1850_DATM%JRA_SLND_SICE_MOM6%REGIONAL%MARBL-BIO_DROF%GLOFAS_SGLC_SWAV --
# compset_override below swaps in the NYF/SROF equivalent with MARBL-BIO
# still active: 1850_DATM%NYF_SLND_SICE_MOM6%REGIONAL%MARBL-BIO_SROF_SGLC_SWAV.
#
# REFERENCE_OCEAN (this config's forcing product, same as base) has no
# marbl_var_names -- it can't supply real MARBL OBC boundary tracers, so
# container_smoke's shell_commands strips every per-tracer OBC_DATA_<tracer>
# line bgc's testmods sets, plus the river-nutrient flux file/toggle (its
# CrocoDash configurator needs a real global_river_nutrients_filepath we
# don't supply). This test deliberately does NOT exercise BGC forcing
# content -- it only checks that a MARBL-BIO-enabled case builds and runs.
#
# The MARBL tracer IC file and the three iron-flux files are a different
# story: CrocoDash's BGCICConfigurator and BGCIronForcingConfigurator are
# both `required_for_compsets = ["MARBL"]` -- crocodash create refuses to
# even build the case without them. The iron-flux files CrocoDash generates
# itself (process_bgc_iron_forcing, all-zero placeholders, same synthetic
# spirit as everything else here) once MARBL is active -- no config needed
# beyond staging their output under bgc's testmods-declared names below.
# The tracer IC file has no such built-in generator (process_bgc_ic just
# shutil.copy()s whatever marbl_ic_filepath points at), so synthetic_marbl_ic
# below has run_regional_test.py write a minimal placeholder before
# `crocodash create` runs -- see write_synthetic_marbl_ic()'s docstring for
# why this needs to be in MOM6's "on-grid" (nx/ny/zl) format rather than a
# real global product.

crocodash:
  grid:
    resolution: 0.1
    xstart: 278.0
    lenx: 1.0
    ystart: 7.0
    leny: 1.0
    name: panama1

  topo:
    min_depth: 9.5
    source:
      type: flat
      depth: 1000.0

  vgrid:
    type: hyperbolic
    nk: 10
    ratio: 20.0

  case:
    cesmroot: /workspace/CESM
    caseroot: /workspace/regional_test_case
    inputdir: /workspace/regional_test_inputdir
    compset: 1850_DATM%NYF_SLND_SICE_MOM6%REGIONAL%MARBL-BIO_SROF_SGLC_SWAV
    atm_grid_name: T62
    machine: ubuntu-latest
    project: PROJ123

  forcings:
    date_range: ["2000-01-01 00:00:00", "2000-01-05 00:00:00"]
    product_name: reference_ocean
    function_name: get_reference_ocean_data
    # marbl_ic_filepath must point at a real, already-existing file by the
    # time `crocodash create` validates its args -- written by
    # write_synthetic_marbl_ic() (see synthetic_marbl_ic below) before that
    # subprocess call. No iron-forcing/river-nutrients args -- those
    # configurators either self-activate from case context (iron) or stay
    # inactive without a real file (river nutrients).
    marbl_ic_filepath: /tmp/ecosys_jan_IC_omip_latlon_1x1_180W_c250613.nc

compset_override: 1850_DATM%NYF_SLND_SICE_MOM6%REGIONAL%MARBL-BIO_SROF_SGLC_SWAV

# Consumed by run_regional_test.py's write_synthetic_marbl_ic(), called
# before `crocodash create` since marbl_ic_filepath must already exist.
# nx/ny/nk match this config's grid/vgrid above (and container_smoke's
# shell_commands NIGLOBAL/NJGLOBAL/NK overrides). Tracer list is bgc's
# testmods' own OBC_DATA_<tracer> names (external MOM_interface repo) --
# the same tracers MARBL's "latest+4p2z" config registers.
synthetic_marbl_ic:
  path: /tmp/ecosys_jan_IC_omip_latlon_1x1_180W_c250613.nc
  nx: 10
  ny: 10
  nk: 10
  tracers:
    - PO4
    - NO3
    - SiO3
    - NH4
    - Fe
    - Lig
    - O2
    - DIC
    - DIC_ALT_CO2
    - ALK
    - ALK_ALT_CO2
    - DOC
    - DON
    - DOP
    - DOPr
    - DONr
    - DOCr
    - microzooC
    - mesozooC
    - spChl
    - spC
    - spP
    - spFe
    - diatChl
    - diatC

# Where regenerated files land. mom/regional/bgc's user_nl_mom (external
# MOM_interface repo) references this domain's grid/topo/vgrid/mesh files
# under a DIFFERENT hash suffix ("_5490e0") than base's own testmods
# ("_352fd1") -- these are two independently-generated static fixtures, so
# the destination names below deliberately differ from mom-regional-base.yaml.
staging:
  din_loc_root_subdir: ocn/mom/croc/testing_data/panama_bgc
  rename_globs:
    - glob: "ocean_hgrid_*.nc"
      dest: ocean_hgrid_panama1_5490e0.nc
    - glob: "ocean_topog_*.nc"
      dest: ocean_topog_panama1_5490e0.nc
    - glob: "ocean_vgrid_*.nc"
      dest: ocean_vgrid_panama1_5490e0.nc
    - glob: "ESMF_mesh_*.nc"
      dest: ESMF_mesh_panama1_5490e0.nc
    # Same phantom-default trick mom-regional-base.yaml needs for
    # ALE_COORDINATE_CONFIG's MOM_input.yaml default (vgrid_65L_20200626.nc,
    # gated on $MOM6_VERTICAL_GRID=zstar_65L) -- check_input_data validates
    # that default's existence independent of any user_nl_mom override.
    - glob: "ocean_vgrid_*.nc"
      dest: vgrid_65L_20200626.nc
    # Same phantom-default reasoning, this time for MARBL_TRACERS_IC_FILE's
    # MOM_input.yaml default (gated on $MARBL_CONFIG=="latest+4p2z", not
    # grid-specific like the iron-flux defaults below) -- stage a second
    # copy of our own synthetic IC file under that generic default name too.
    - glob: "ecosys_jan_IC_omip_latlon_1x1_180W_c250613.nc"
      dest: ecosys_jan_IC_omip_latlon_1x1_180W_c231221.nc
    # CrocoDash's BGCIronForcingConfigurator names these
    # fesedflux_total_reduce_oxic_<grid>_<session>.nc /
    # feventflux_5gmol_<grid>_<session>.nc / fesedfluxred_<grid>_<session>.nc
    # -- a different <grid>_<session> than bgc's testmods (external
    # MOM_interface repo) declare, and a "fesedfluxred" vs "feventfluxred"
    # prefix mismatch on the third one (an upstream naming inconsistency
    # between the two repos, not something to fix here). Glob broadly and
    # rename to testmods' exact literal names, same pattern as the grid files.
    - glob: "fesedflux_total_reduce_oxic_*.nc"
      dest: fesedflux_total_reduce_oxic_panama1_5490e0.nc
    - glob: "feventflux_5gmol_*.nc"
      dest: feventflux_5gmol_panama1_5490e0.nc
    - glob: "fesedfluxred_*.nc"
      dest: feventfluxred_5gmol_panama1_5490e0.nc
  copy_as_is:
    - forcing_obc_segment_001.nc
    - forcing_obc_segment_002.nc
    - forcing_obc_segment_003.nc
    - forcing_obc_segment_004.nc
    - init_eta.nc
    - init_tracers.nc
    - init_vel.nc
    - ecosys_jan_IC_omip_latlon_1x1_180W_c250613.nc
