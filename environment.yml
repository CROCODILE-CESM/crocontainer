  - cdsapi>=0.7.6,<0.8.0
  - numcodecs>=0.10.0,<0.16
  - h5netcdf>=1.7.3,<1.8.0
  - pip>=24.2,<24.3
  - pip:
    - -e ./CrocoDash/visualCaseGen/external/mom6_forge/
    - -e ./CrocoDash/rm6/
    - -e ./CrocoDash/visualCaseGen/external/ipyfilechooser/
    - -e ./CrocoDash/visualCaseGen/
    - -e ./CrocoDash/
